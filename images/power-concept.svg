<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">ZOOP rechargeable power concept</title>
  <desc id="desc">Battery to charger, charger regulated output through a removable connection to the ESP32 and sensors. Never connect ESP32 USB while the charger output is connected.</desc>
  <rect width="1000" height="340" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#172334">
    <text x="35" y="36" font-size="24" font-weight="bold">Rechargeable power concept — not a finished wiring design</text>
    <g fill="#eaf1f8" stroke="#315675" stroke-width="2">
      <rect x="35" y="88" width="190" height="94" rx="8"/>
      <rect x="305" y="75" width="240" height="120" rx="8"/>
      <rect x="700" y="75" width="260" height="120" rx="8"/>
    </g>
    <g font-size="17">
      <text x="50" y="120">Protected 3.7 V</text>
      <text x="50" y="146">500 mAh LiPo</text>
      <text x="320" y="108">bq25185 charger</text>
      <text x="320" y="134">3.3 V buck output</text>
      <text x="320" y="160">Set charge to 500 mA</text>
      <text x="715" y="108">ESP32 3V3 + GND</text>
      <text x="715" y="134">and compatible sensors</text>
      <text x="715" y="160">on shared 3.3 V rail</text>
    </g>
    <g fill="none" stroke="#315675" stroke-width="3">
      <path d="M225 135h80"/>
      <path d="M545 135h50m15 0h90"/>
    </g>
    <text x="230" y="121" font-size="14">JST</text>
    <text x="550" y="119" font-size="13">removable</text>
    <text x="550" y="159" font-size="13">3.3 V + GND</text>
    <text x="35" y="235" font-size="17" font-weight="bold" fill="#a22b22">Never connect ESP32 USB with charger output connected to ESP32 3V3.</text>
    <text x="35" y="265" font-size="16">Charge off-body. Circuit, source selection, enclosure and battery retention are unverified.</text>
    <text x="35" y="295" font-size="16">The carrier PCB does not include the charger or battery. See README before building.</text>
  </g>
</svg>
