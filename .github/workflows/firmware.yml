name: ZOOP firmware

on:
  push:
    paths:
      - firmware/**
      - tests/**
      - .github/workflows/firmware.yml
  pull_request:
    paths:
      - firmware/**
      - tests/**
      - .github/workflows/firmware.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test firmware logic on host
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Itests/stubs tests/firmware_test.cpp -o "$RUNNER_TEMP/zoop-test"
          "$RUNNER_TEMP/zoop-test"
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.6.0"
      - name: Install pinned dependencies
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.5
          arduino-cli lib install "SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2"
      - name: Compile ESP32-S3 firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
            --warnings all \
            --output-dir build \
            firmware/ZOOP
      - uses: actions/upload-artifact@v4
        with:
          name: zoop-esp32s3-firmware
          path: build/
